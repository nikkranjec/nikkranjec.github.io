<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#171614">
<title>Pred potjo — prostor za premislek</title>
<meta name="description" content="Zaseben prostor za premislek, namero, skrb in integracijo pred psihedelično izkušnjo.">
<style>
:root {
  color-scheme: dark;
  --night: #171614;
  --night-deep: #11110f;
  --night-soft: #201e1a;
  --ink: #e6dece;
  --ink-soft: #cbc1ae;
  --muted: #a39a88;
  --faint: #787264;
  --rule: rgba(230, 222, 206, .17);
  --rule-strong: rgba(230, 222, 206, .30);
  --oxide: #b17d5e;
  --lichen: #9b9a7c;
  --focus: #d9b18b;
  --serif: "Bodoni 72", Didot, "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --sans: "Helvetica Neue", Helvetica, Arial, ui-sans-serif, system-ui, sans-serif;
  --rail: 17rem;
  --measure: 67rem;
}
* { box-sizing: border-box; }
html { min-width: 320px; scroll-behavior: smooth; scroll-padding-top: 5rem; }
body {
  min-width: 320px; min-height: 100vh; margin: 0; overflow-x: hidden;
  color: var(--ink);
  background:
    radial-gradient(ellipse at 74% 5%, rgba(108, 83, 61, .16), transparent 38rem),
    radial-gradient(ellipse at 8% 74%, rgba(105, 111, 80, .075), transparent 34rem),
    linear-gradient(115deg, #181714 0%, #171614 48%, #131310 100%);
  font: 400 1rem/1.72 var(--serif);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
body::before {
  content: ""; position: fixed; z-index: 60; inset: 0; pointer-events: none;
  opacity: .16; mix-blend-mode: soft-light;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='grain'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23grain)' opacity='.32'/%3E%3C/svg%3E");
}
body::after {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: -1;
  background: radial-gradient(ellipse at center, transparent 42%, rgba(0,0,0,.22) 100%);
}
button, textarea, input { font: inherit; }
button, a { -webkit-tap-highlight-color: transparent; }
a { color: inherit; }
button:focus-visible, a:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--focus); outline-offset: 4px; }
::selection { color: var(--night); background: var(--ink-soft); }
.skip-link { position: fixed; z-index: 100; top: 1rem; left: 1rem; padding: .7rem 1rem; color: var(--night); background: var(--ink); transform: translateY(-150%); font: 600 .8rem var(--sans); }
.skip-link:focus { transform: translateY(0); }
.shell { width: min(100%, 120rem); min-height: 100vh; margin: 0 auto; }
.layout { display: grid; grid-template-columns: var(--rail) minmax(0,1fr); }
/* Desktop index */
.rail {
  position: sticky; top: 0; align-self: start; height: 100vh; min-height: 36rem; overflow-y: auto;
  padding: 2.1rem 1.45rem 1.8rem 2rem;
  border-right: 1px solid var(--rule);
  background: linear-gradient(180deg, rgba(9,9,8,.24), rgba(22,21,18,.12));
}
.brand { display: flex; align-items: center; gap: .8rem; margin: 0 0 3.1rem; text-decoration: none; }
.brand-stamp { display: grid; place-items: center; width: 2.05rem; height: 2.05rem; border: 1px solid rgba(230,222,206,.36); border-radius: 50%; color: var(--ink-soft); font: italic 1.15rem var(--serif); transform: rotate(-9deg); }
.brand-copy { display: grid; gap: .2rem; }
.brand-title { font: 500 .98rem/1.2 var(--serif); letter-spacing: .015em; }
.brand-caption { color: var(--faint); font: 600 .55rem/1.35 var(--sans); letter-spacing: .19em; text-transform: uppercase; }
.rail-label { margin: 0 0 .95rem; color: var(--faint); font: 600 .57rem var(--sans); letter-spacing: .2em; text-transform: uppercase; }
.stage-nav { position: relative; list-style: none; padding: 0; margin: 0; }
.stage-nav::before { content: ""; position: absolute; top: .8rem; bottom: .8rem; left: .42rem; width: 1px; background: linear-gradient(var(--rule-strong), var(--rule), transparent); }
.stage-nav li { position: relative; }
.stage-nav a { display: grid; grid-template-columns: 1.15rem minmax(0,1fr) auto; gap: .7rem; align-items: start; min-height: 3.55rem; padding: .48rem 0; color: var(--muted); text-decoration: none; transition: color .2s ease; }
.stage-nav a:hover, .stage-nav a[aria-current="page"] { color: var(--ink); }
.stage-nav .node { position: relative; z-index: 1; display: grid; place-items: center; width: .86rem; height: .86rem; margin-top: .18rem; border: 1px solid var(--faint); border-radius: 50%; background: var(--night); color: transparent; font: 600 .42rem var(--sans); transition: all .25s ease; }
.stage-nav a[aria-current="page"] .node { border-color: var(--oxide); background: var(--oxide); box-shadow: 0 0 0 4px rgba(177,125,94,.12); }
.stage-nav a.is-touched .node { border-color: var(--lichen); background: var(--lichen); }
.nav-copy { display: grid; gap: .12rem; min-width: 0; }
.nav-title { font: 500 .81rem/1.35 var(--sans); }
.nav-meta { color: var(--faint); font: 400 .63rem/1.4 var(--sans); }
.nav-count { padding-top: .08rem; color: var(--faint); white-space: nowrap; font: 400 .58rem var(--sans); font-variant-numeric: tabular-nums; }
.rail-bottom { margin-top: 2.4rem; padding-top: 1.25rem; border-top: 1px solid var(--rule); }
.privacy-note { max-width: 15rem; margin: 0 0 1.15rem; color: var(--faint); font: 400 .67rem/1.6 var(--sans); }
.rail-actions { display: grid; justify-items: start; gap: .12rem; }
.quiet-button { padding: .38rem 0; border: 0; color: var(--muted); background: transparent; cursor: pointer; text-align: left; font: 500 .68rem var(--sans); letter-spacing: .045em; }
.quiet-button:hover { color: var(--ink); }
.save-state { min-height: 1.1rem; margin: .95rem 0 0; color: var(--faint); font: 400 .62rem/1.5 var(--sans); }
.save-state[data-error="true"] { color: #d59c7e; }
/* Mobile header and language switch */
.topbar { display: none; position: sticky; top: 0; z-index: 45; align-items: center; gap: .65rem; min-height: 3.65rem; padding: .45rem max(1rem, env(safe-area-inset-right)) .45rem max(1rem, env(safe-area-inset-left)); border-bottom: 1px solid var(--rule); background: rgba(23,22,20,.94); backdrop-filter: blur(18px); }
.topbar-name { min-width: 0; flex: 1; overflow: hidden; color: var(--ink-soft); white-space: nowrap; text-overflow: ellipsis; font: 500 .78rem var(--serif); }
.nav-toggle { flex: none; padding: .55rem .2rem; border: 0; color: var(--ink-soft); background: none; cursor: pointer; font: 600 .62rem var(--sans); letter-spacing: .1em; text-transform: uppercase; }
.lang-toggle { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; min-height: 2.15rem; padding: .35rem .55rem; border: 1px solid var(--rule-strong); border-radius: 1px; color: var(--ink-soft); background: rgba(230,222,206,.035); cursor: pointer; white-space: nowrap; font: 600 .61rem var(--sans); letter-spacing: .12em; }
.lang-toggle .current-lang { color: var(--ink); }
.lang-toggle .lang-separator { color: var(--faint); }
.lang-toggle .next-lang { color: var(--muted); }
.lang-toggle:hover { border-color: var(--oxide); }
.top-progress { position: absolute; right: 0; bottom: -1px; left: 0; height: 1px; background: transparent; }
.top-progress span { display: block; width: 0; height: 100%; background: var(--oxide); transition: width .45s ease; }
/* Main canvas */
.main-wrap { min-width: 0; padding: 0 clamp(1.25rem, 5.3vw, 6.5rem) 6rem; }
.desktop-tools { position: sticky; top: 0; z-index: 45; display: flex; align-items: center; justify-content: space-between; gap: 1.5rem; width: min(100%, var(--measure)); margin: 0 auto; padding: .9rem 0 .65rem; background: linear-gradient(180deg, rgba(23,22,20,.98), rgba(23,22,20,.88)); backdrop-filter: blur(14px); }
.folio-label { color: var(--faint); font: 600 .56rem var(--sans); letter-spacing: .2em; text-transform: uppercase; }
.content { width: min(100%, var(--measure)); margin: 0 auto; }
.view { min-height: calc(100vh - 2rem); padding: clamp(3.25rem, 7.5vh, 6.5rem) 0 3rem; }
.view[hidden] { display: none !important; }
.view:focus { outline: none; }
/* Opening composition */
.hero { position: relative; display: grid; grid-template-columns: minmax(0,1.05fr) minmax(15rem,.85fr); align-items: center; gap: clamp(1rem, 4vw, 4rem); min-height: min(39rem, 72vh); padding: 1.25rem 0 2.5rem; }
.hero-copy { position: relative; z-index: 2; min-width: 0; }
.eyebrow { display: flex; align-items: center; gap: .75rem; margin: 0 0 1.5rem; color: var(--oxide); font: 600 .59rem/1.3 var(--sans); letter-spacing: .2em; text-transform: uppercase; }
.eyebrow::before { content: ""; width: 2.1rem; height: 1px; background: var(--oxide); }
h1, h2, h3, p { margin-top: 0; }
h1, h2 { font-family: var(--serif); font-weight: 400; }
h1 { max-width: 8ch; margin: 0 0 1.55rem; font-size: clamp(4.3rem, 8.7vw, 8.9rem); line-height: .83; letter-spacing: -.075em; text-wrap: balance; }
h1 span { display: block; }
h1 em { display: block; padding-left: .42em; color: var(--ink-soft); font-weight: 400; }
.hero-subtitle { max-width: 27rem; margin: 0; color: var(--ink-soft); font: 400 clamp(.94rem, 1.35vw, 1.08rem)/1.75 var(--sans); }
.hero-plate { position: relative; display: grid; place-items: center; min-width: 0; min-height: 27rem; margin: 0; }
.hero-plate::before { content: ""; position: absolute; inset: 7% 6% 7% 8%; border: 1px solid rgba(230,222,206,.12); border-radius: 49% 51% 47% 53% / 52% 45% 55% 48%; transform: rotate(-11deg); }
.hero-plate::after { content: ""; position: absolute; inset: 13% 13% 12% 14%; border: 1px solid rgba(230,222,206,.09); border-radius: 53% 47% 51% 49% / 44% 56% 44% 56%; transform: rotate(18deg); }
.hero-engraving { position: relative; z-index: 1; width: min(100%, 33rem); height: auto; overflow: visible; opacity: .76; filter: drop-shadow(0 7px 14px rgba(0,0,0,.16)); }
.plate-caption { position: absolute; right: 1.1rem; bottom: 1.2rem; z-index: 2; color: var(--faint); font: 600 .52rem/1.5 var(--sans); letter-spacing: .18em; text-align: right; text-transform: uppercase; }
.hero-index { position: absolute; top: 4%; right: 2%; color: rgba(230,222,206,.34); font: 400 .58rem var(--sans); letter-spacing: .15em; writing-mode: vertical-rl; }
.hero-divider { display: flex; align-items: center; gap: 1rem; margin: 1.4rem 0 1.65rem; color: var(--faint); }
.hero-divider::before { content: ""; width: 3.4rem; height: 1px; background: var(--rule-strong); }
.hero-divider span { font: 600 .56rem var(--sans); letter-spacing: .19em; text-transform: uppercase; }
.intro-copy { max-width: 43rem; color: var(--ink-soft); font-size: 1.05rem; line-height: 1.86; }
.intro-copy p { margin: 0 0 1rem; }
.care-note { position: relative; max-width: 48rem; margin: 2.2rem 0 2.4rem; padding: 1rem 1.15rem 1.1rem 1.3rem; border-left: 1px solid var(--oxide); background: linear-gradient(100deg, rgba(177,125,94,.085), transparent 78%); color: var(--ink-soft); font: 400 .8rem/1.75 var(--sans); }
.care-note strong { color: var(--ink); font-weight: 600; }
.welcome-meta { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 1.3rem; margin: 2.8rem 0 2.6rem; padding-top: 1.15rem; border-top: 1px solid var(--rule); }
.meta-item { display: grid; align-content: start; gap: .35rem; }
.meta-label { color: var(--faint); font: 600 .54rem var(--sans); letter-spacing: .19em; text-transform: uppercase; }
.meta-value { color: var(--muted); font: 400 .72rem/1.55 var(--sans); }
.primary-button, .secondary-button { display: inline-flex; align-items: center; justify-content: center; gap: .8rem; min-height: 3.2rem; padding: .8rem 1.15rem; border: 1px solid transparent; border-radius: 1px; cursor: pointer; text-decoration: none; font: 600 .66rem/1.2 var(--sans); letter-spacing: .13em; text-transform: uppercase; transition: color .2s ease, background .2s ease, border-color .2s ease, transform .2s ease; }
.primary-button { color: #1b1915; background: var(--ink-soft); }
.primary-button:hover { background: #f0e8d9; transform: translateY(-1px); }
.primary-button .arrow { font-size: 1rem; line-height: .5; }
.secondary-button { color: var(--ink-soft); border-color: var(--rule-strong); background: transparent; }
.secondary-button:hover { border-color: var(--oxide); background: rgba(177,125,94,.06); }
.resume { margin: 1rem 0 0; color: var(--muted); font: 400 .73rem/1.6 var(--sans); }
.resume a { color: var(--ink); text-underline-offset: .2em; }
/* Chapter composition */
.chapter-view { max-width: 61rem; }
.chapter-head { position: relative; margin-bottom: 2.8rem; padding: 1rem 0 2rem; border-bottom: 1px solid var(--rule); }
.chapter-index { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem; margin-bottom: 1.25rem; color: var(--oxide); font: 600 .57rem/1.3 var(--sans); letter-spacing: .18em; text-transform: uppercase; }
.chapter-index .index-line { width: 2.1rem; height: 1px; background: var(--rule-strong); }
.chapter-index .index-label { color: var(--muted); }
.chapter-title { max-width: 17ch; margin: 0 0 .85rem; font-size: clamp(2.8rem, 5.8vw, 5.25rem); line-height: .97; letter-spacing: -.055em; text-wrap: balance; }
.chapter-lead { max-width: 43rem; margin: 0; color: var(--ink-soft); font: 400 clamp(.94rem, 1.2vw, 1.04rem)/1.8 var(--sans); }
.chapter-body { max-width: 53rem; }
.prompt-group { display: grid; grid-template-columns: minmax(0, 1fr); margin: 0 0 2.15rem; padding-top: 1.05rem; border-top: 1px solid var(--rule); }
.prompt-head { display: grid; grid-template-columns: 3.2rem minmax(0,1fr); gap: .85rem; align-items: start; }
.prompt-number { padding-top: .24rem; color: var(--oxide); font: 500 .65rem var(--sans); letter-spacing: .09em; font-variant-numeric: tabular-nums; }
.prompt-copy { min-width: 0; }
.prompt-title { max-width: 42rem; margin: 0; color: var(--ink); font: 400 clamp(1.1rem, 1.7vw, 1.35rem)/1.5 var(--serif); }
.prompt-hint { margin: .42rem 0 0; color: var(--muted); font: 400 .72rem/1.6 var(--sans); }
.answer-wrap { margin: .8rem 0 0 4.05rem; min-width: 0; }
textarea, input[type="text"] { display: block; width: 100%; min-width: 0; min-height: 5.2rem; padding: .8rem .9rem; border: 1px solid rgba(230,222,206,.16); border-radius: 1px; color: var(--ink); background: rgba(233,225,207,.035); font: 400 .83rem/1.7 var(--sans); resize: vertical; transition: border-color .2s ease, background .2s ease; }
textarea::placeholder, input[type="text"]::placeholder { color: #898274; opacity: .9; }
textarea:hover, input[type="text"]:hover { border-color: rgba(230,222,206,.31); }
textarea:focus, input[type="text"]:focus { border-color: var(--oxide); background: rgba(233,225,207,.06); outline: none; }
textarea.short { min-height: 3.4rem; }
.section-aside { max-width: 46rem; margin: 2.4rem 0 2.8rem 4.05rem; padding: 1rem 1.15rem 1.1rem; border-top: 1px solid var(--rule-strong); border-bottom: 1px solid var(--rule); background: linear-gradient(105deg, rgba(155,154,124,.065), transparent 80%); }
.aside-label { margin: 0 0 .45rem; color: var(--lichen); font: 600 .56rem var(--sans); letter-spacing: .17em; text-transform: uppercase; }
.section-aside p:last-child { margin: 0; color: var(--ink-soft); font: 400 .78rem/1.75 var(--sans); }
.section-aside p strong { color: var(--ink); }
.chapter-footer { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin: 3.7rem 0 0; padding-top: 1.2rem; border-top: 1px solid var(--rule); }
.back-link { color: var(--muted); text-decoration: none; font: 500 .68rem var(--sans); letter-spacing: .04em; }
.back-link:hover { color: var(--ink); }
.footer-actions { display: flex; align-items: center; gap: .8rem; }
/* Carry-forward note */
.carry-card { position: relative; overflow: hidden; margin: 3rem 0 2rem 4.05rem; padding: 1.2rem 1.3rem 1.4rem; border: 1px solid rgba(177,125,94,.34); background: linear-gradient(135deg, rgba(81,57,43,.24), rgba(34,31,26,.35)); }
.carry-card::before { content: ""; position: absolute; top: -8rem; right: -5rem; width: 20rem; height: 20rem; border: 1px solid rgba(177,125,94,.12); border-radius: 51% 49% 46% 54%; transform: rotate(22deg); pointer-events: none; }
.carry-kicker { margin: 0 0 .55rem; color: var(--oxide); font: 600 .55rem var(--sans); letter-spacing: .2em; text-transform: uppercase; }
.carry-title { margin: 0 0 .5rem; font: 400 clamp(1.6rem, 3vw, 2.2rem)/1.15 var(--serif); }
.carry-intro { max-width: 38rem; margin: 0 0 1.35rem; color: var(--ink-soft); font: 400 .76rem/1.7 var(--sans); }
.carry-fields { position: relative; display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 1rem 1.1rem; }
.carry-field { min-width: 0; }
.carry-field.wide { grid-column: 1 / -1; }
.carry-field label { display: block; margin: 0 0 .35rem; color: var(--muted); font: 600 .56rem/1.4 var(--sans); letter-spacing: .12em; text-transform: uppercase; }
.carry-field input { min-height: 3rem; }
.carry-field textarea { min-height: 4rem; }
.final-note { max-width: 45rem; margin: 2rem 0 0 4.05rem; color: var(--ink-soft); font: 400 .84rem/1.8 var(--sans); }
.final-note em { color: var(--ink); font: italic 1.2rem var(--serif); }
.keep-section { margin: 3.3rem 0 0 4.05rem; padding-top: 1.35rem; border-top: 1px solid var(--rule-strong); }
.keep-section h3 { margin: 0 0 .45rem; font: 400 1.7rem var(--serif); }
.keep-section p { max-width: 42rem; margin: 0; color: var(--muted); font: 400 .73rem/1.7 var(--sans); }
.keep-actions { display: flex; flex-wrap: wrap; gap: .7rem; margin-top: 1.1rem; }
/* Dialog */
dialog { width: min(calc(100% - 2rem), 28rem); padding: 1.5rem; border: 1px solid var(--rule-strong); border-radius: 2px; color: var(--ink); background: #24211c; box-shadow: 0 25px 100px rgba(0,0,0,.45); }
dialog::backdrop { background: rgba(5,5,4,.78); backdrop-filter: blur(5px); }
dialog h3 { margin: 0 0 .6rem; font: 400 1.55rem var(--serif); }
dialog p { margin: 0 0 1.35rem; color: var(--ink-soft); font: 400 .8rem/1.7 var(--sans); }
.dialog-actions { display: flex; flex-wrap: wrap; gap: .65rem; }
.vh { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
/* Responsive layouts */
@media (max-width: 900px) {
  .layout { display: block; }
  .topbar { display: flex; }
  .rail { display: none; position: fixed; inset: 3.65rem 0 auto; z-index: 40; width: 100%; height: auto; min-height: 0; max-height: calc(100dvh - 3.65rem); overflow: auto; padding: 1rem 1.2rem 1.3rem; border-right: 0; border-bottom: 1px solid var(--rule-strong); background: rgba(24,22,19,.98); backdrop-filter: blur(20px); }
  .rail[data-open="true"] { display: block; }
  .brand { display: none; }
  .stage-nav { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); column-gap: 1rem; }
  .stage-nav::before { display: none; }
  .stage-nav a { min-height: 2.9rem; }
  .rail-bottom { margin-top: 1.1rem; }
  .main-wrap { padding: 0 clamp(1.3rem, 5vw, 3.5rem) 4.5rem; }
  .desktop-tools { display: none; }
  .view { min-height: calc(100dvh - 3.65rem); padding-top: clamp(2.8rem, 7vh, 4.8rem); }
  .hero { min-height: 0; grid-template-columns: minmax(0,1fr) minmax(12rem,.7fr); gap: 1rem; padding-top: .4rem; }
  .hero-plate { min-height: 22rem; }
}
@media (max-width: 620px) {
  .main-wrap { padding-inline: clamp(1rem, 5vw, 1.45rem); }
  .view { padding-top: 2.2rem; }
  .hero { display: block; padding: .25rem 0 1.1rem; }
  .hero-copy { max-width: 36rem; }
  h1 { max-width: 8ch; margin-bottom: 1.1rem; font-size: clamp(4.05rem, 17vw, 6rem); }
  .hero-subtitle { max-width: 29rem; font-size: .94rem; }
  .hero-plate { position: absolute; top: 2.2rem; right: 0; width: min(50vw, 16rem); min-height: 0; opacity: .28; }
  .hero-plate::before, .hero-plate::after { display: none; }
  .hero-engraving { width: 100%; }
  .plate-caption, .hero-index { display: none; }
  .hero-divider { margin-top: 1.5rem; }
  .intro-copy { font-size: .98rem; }
  .welcome-meta { grid-template-columns: 1fr; gap: .8rem; margin: 2rem 0 1.9rem; }
  .meta-item { grid-template-columns: 6.2rem minmax(0,1fr); align-items: baseline; gap: .7rem; }
  .chapter-head { margin-bottom: 2rem; padding-top: .35rem; padding-bottom: 1.45rem; }
  .chapter-title { max-width: 14ch; font-size: clamp(2.6rem, 12vw, 4.2rem); }
  .chapter-lead { font-size: .9rem; }
  .prompt-group { margin-bottom: 1.8rem; padding-top: .85rem; }
  .prompt-head { grid-template-columns: 2.25rem minmax(0,1fr); gap: .55rem; }
  .prompt-title { font-size: 1.12rem; line-height: 1.48; }
  .answer-wrap { margin: .7rem 0 0 2.8rem; }
  textarea, input[type="text"] { min-height: 5rem; padding: .75rem; font-size: .82rem; }
  .section-aside, .carry-card, .final-note, .keep-section { margin-left: 2.8rem; }
  .section-aside { padding: .85rem .9rem; }
  .carry-card { padding: 1rem; }
  .carry-fields { grid-template-columns: 1fr; }
  .carry-field.wide { grid-column: auto; }
  .chapter-footer { align-items: center; margin-top: 2.8rem; }
  .chapter-footer .primary-button { min-width: 0; }
  .footer-actions { gap: .45rem; }

      out += `${String(index+1).padStart(2,'0')}  ${stage.title.toLocaleUpperCase(state.language === 'sl' ? 'sl-SI' : 'en-GB')}\n${'—'.repeat(Math.max(8, stage.title.length))}\n\n`;
      stage.prompts.forEach(prompt => {
        out += `${prompt.text}\n${answerValue(prompt.key).trim() || c.empty}\n\n`;
      });
      if (stage.aside) out += `${stage.aside.label}\n${stage.aside.text}\n\n`;
      if (stage.note) out += `${stage.note.label}\n${stage.note.title ? stage.note.title + ' ' : ''}${stage.note.text}\n\n`;
      if (stage.after) out += `${stage.after.label}\n${stage.after.text}\n\n`;
      if (index === 5) {
        out += `${c.carry.title.toLocaleUpperCase(state.language === 'sl' ? 'sl-SI' : 'en-GB')}\n`;
        c.carry.fields.forEach(field => { out += `${field.label}\n${answerValue(field.key).trim() || c.empty}\n\n`; });
      }
    });
    out += `\n${c.finalEmphasis} ${c.finalText}\n\n${c.careText}\n`;
    return out;
  }
  function download() {
    collectAnswers();
    const blob = new Blob([makeExport()], { type:'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = state.language === 'sl' ? 'pred-potjo-zapisi.txt' : 'before-the-journey-reflections.txt';
    document.body.appendChild(link); link.click(); link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    saveNow();
  }
  function clearAll() {
    state.answers = {}; state.lastStage = 1;
    try { localStorage.removeItem(STORAGE_KEY); state.storageOK = true; } catch (_) { state.storageOK = false; }
    const activeHash = location.hash;
    render();
    if (activeHash && activeHash !== '#welcome') location.hash = '#welcome';
    else route();
    setSaveStatus(state.storageOK ? currentCopy().saved : currentCopy().saveError, !state.storageOK);
  }

  render();
  if (!state.storageOK) setSaveStatus(currentCopy().saveError, true);
  $('#nav-toggle').addEventListener('click', () => setNav($('#rail').dataset.open !== 'true'));
  $('#stage-nav').addEventListener('click', event => { if (event.target.closest('a')) setNav(false); });
  document.addEventListener('keydown', event => { if (event.key === 'Escape') setNav(false); });
  document.addEventListener('input', onEdit);
  document.addEventListener('change', onEdit);
  document.addEventListener('click', event => {
    const langButton = event.target.closest('[data-lang-toggle]');
    if (langButton) { setLanguage(state.language === 'sl' ? 'en' : 'sl'); return; }
    const action = event.target.closest('[data-action]')?.dataset.action;
    if (action === 'download') download();
    if (action === 'print') { collectAnswers(); saveNow(); window.print(); }
    if (action === 'clear') $('#clear-dialog').showModal();
  });
  $('#confirm-clear').addEventListener('click', () => { $('#clear-dialog').close(); clearAll(); });
  $('#cancel-clear').addEventListener('click', () => $('#clear-dialog').close());
  $('#clear-dialog').addEventListener('click', event => { if (event.target === $('#clear-dialog')) $('#clear-dialog').close(); });
  window.addEventListener('hashchange', () => route());
  window.addEventListener('pagehide', () => { collectAnswers(); saveNow(); });
  window.addEventListener('beforeprint', () => { collectAnswers(); document.body.classList.add('print-all'); $$('.chapter-view').forEach(view => { view.hidden = false; }); });
  window.addEventListener('afterprint', () => { document.body.classList.remove('print-all'); route({scroll:false,focus:false}); });
  route({scroll:false,focus:false});
})();
</script>
</body>
</html>
