*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:1.5rem;-webkit-text-size-adjust:100%}
body{margin:0;background-color:var(--paper);background-image:var(--paper-grain);background-size:1536px 1536px;background-repeat:repeat;color:var(--ink);font-family:var(--text);font-size:18px;line-height:1.58;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:20;opacity:.075;background-image:var(--paper-grain);background-size:1120px 1120px;mix-blend-mode:multiply}
a{color:inherit;text-decoration:none}
a:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.22em}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:1px solid var(--rust);outline-offset:5px}
::selection{background:#8e684d;color:#f3ead9}
.vh{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip-link{position:fixed;left:1rem;top:-5rem;z-index:100;background:var(--paper);padding:.5rem 1rem}.skip-link:focus{top:1rem}
.publication-header{position:relative;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1.5rem clamp(1.2rem,4.6vw,5.5rem) 1rem}
.wordmark{font:400 clamp(1rem,1.3vw,1.25rem)/1 var(--display);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.lang-toggle{border:0;background:transparent;padding:.2rem 0;display:flex;align-items:center;gap:.55rem;font:400 .85rem/1 var(--display);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.lang-toggle .current-lang{opacity:.45}.lang-toggle:hover .next-lang{color:var(--rust)}
.publication{width:100%;max-width:1800px;margin:0 auto}
/* COVER: one continuous composition, not a hero card */
.cover{position:relative;padding:clamp(1.8rem,4vw,4.5rem) clamp(1.2rem,4.6vw,5.5rem) 4rem;isolation:isolate}
.cover-title{position:relative;z-index:3;margin:0 0 -.02em -.025em;font:400 clamp(3.1rem,11.1vw,11.6rem)/.82 var(--display);letter-spacing:-.065em;white-space:nowrap;text-transform:none;width:max-content;max-width:100%}
.cover-main{position:relative;display:grid;grid-template-columns:minmax(300px,.72fr) minmax(0,1.28fr);align-items:center;min-height:clamp(560px,58vw,820px);margin-top:-.55rem}
.cover-scene{position:relative;z-index:1;right:auto;top:auto;width:calc(100% + clamp(1.5rem,4vw,4rem));height:clamp(560px,58vw,820px);margin:0 0 0 -3%;overflow:hidden;mix-blend-mode:multiply}
.cover-scene img{width:100%;height:100%;display:block;object-fit:cover;object-position:44% 50%;filter:grayscale(1) contrast(1.09) sepia(.12)}
.cover-scene:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(216,208,193,.10),transparent 33%),linear-gradient(0deg,rgba(216,208,193,.08),transparent 28%);pointer-events:none}
.cover-copy{position:relative;z-index:4;margin:0 -12% 0 11%;width:auto;max-width:34rem;padding:2rem 0 1rem}
.cover-subtitle{margin:0 0 2rem;font:italic 400 clamp(1.35rem,2.2vw,2.25rem)/1.25 var(--display);color:var(--ink-soft);max-width:17em}
.cover-standfirst{max-width:28rem;margin:0 0 2.2rem;font:400 1.03rem/1.65 var(--text);color:var(--ink-soft)}
.text-link{display:inline-flex;align-items:center;gap:1.5rem;padding:.2rem 0 .45rem;border:0;border-bottom:1px solid rgba(28,26,23,.5);background:none;font:400 1.05rem/1.2 var(--display);letter-spacing:.06em}
.text-link .arrow{display:inline-block;transition:transform .35s ease}.text-link:hover .arrow{transform:translateX(7px)}
.resume{margin:1.3rem 0 0;font:italic 400 .95rem/1.5 var(--text);color:var(--fade)}.resume a{text-decoration:underline;text-underline-offset:.2em}
.cover-bottom{position:relative;z-index:2;display:grid;grid-template-columns:minmax(210px,.8fr) minmax(280px,1fr);gap:clamp(2rem,8vw,8rem);align-items:end;margin:clamp(3rem,7vw,7rem) 5% 0 0}

  function currentCopy(){ return COPY[state.language]; }
  function esc(value){ return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
  function answerValue(key){ return typeof state.answers[key] === 'string' ? state.answers[key] : ''; }
  function hasAnswers(){ return Object.values(state.answers).some(value => typeof value === 'string' ? value.trim() : Boolean(value)); }
  function setSaveStatus(message, isError=false){ const el=$('#save-state'); if(!el)return; el.textContent=message; el.dataset.error=isError?'true':'false'; }
  function saveNow(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify({answers:state.answers,lastStage:state.lastStage})); state.storageOK=true; setSaveStatus(currentCopy().saved); }
    catch(_){ state.storageOK=false; setSaveStatus(currentCopy().saveError,true); }
  }
  function queueSave(){ setSaveStatus(currentCopy().saving); clearTimeout(state.saveTimer); state.saveTimer=setTimeout(saveNow,350); }
  function collectAnswers(){
    $$('[data-key]').forEach(el=>{ const key=el.dataset.key; if(el.type==='checkbox'){ if(el.checked)state.answers[key]=true; else delete state.answers[key]; } else if(String(el.value??'').trim())state.answers[key]=el.value; else delete state.answers[key]; });
  }
  try{
    const saved=localStorage.getItem(STORAGE_KEY);
    if(saved){const parsed=JSON.parse(saved);if(parsed&&parsed.answers&&typeof parsed.answers==='object'){state.answers=parsed.answers;state.lastStage=Number.isInteger(parsed.lastStage)?Math.min(6,Math.max(1,parsed.lastStage)):1;}}
    const lang=localStorage.getItem(LANGUAGE_KEY); if(lang==='sl'||lang==='en')state.language=lang;
  }catch(_){state.storageOK=false;}

  function languageMarkup(c){
    const current=state.language.toUpperCase(), next=state.language==='sl'?'EN':'SL';
    return `<button class="lang-toggle" type="button" data-lang-toggle aria-label="${esc(c.switchLabel)}"><span class="current-lang">${current}</span><span aria-hidden="true">/</span><span class="next-lang">${next}</span></button>`;
  }
  function noteMarkup(note){
    if(!note)return '';
    const title=note.title || note.label || '';
    return `<aside class="editorial-note">${title?`<span class="note-title">${esc(title)}</span>`:''}<p>${esc(note.text)}</p></aside>`;
  }
  function promptMarkup(prompt, stage){
    const id=`field-${prompt.key.replace('.','-')}`;
    const number=prompt.key;
    return `<article class="reflection">
      <div class="reflection-heading"><span class="question-number">${esc(number)}</span><div><h3 class="question-title" id="label-${id}">${esc(prompt.text)}</h3>${prompt.hint?`<p class="question-hint">${esc(prompt.hint)}</p>`:''}</div></div>
      <div class="answer-wrap"><label class="vh" for="${id}">${esc(prompt.text)}</label><textarea id="${id}" data-key="${esc(prompt.key)}" rows="4" spellcheck="true" aria-labelledby="label-${id}">${esc(answerValue(prompt.key))}</textarea></div>
    </article>`;
  }
  function carryMarkup(c){
    const fields=c.carry.fields.map(field=>{
      const id=`field-${field.key.replace('.','-')}`;
      const rows=field.rows||1;
      const control=rows>1
        ? `<textarea id="${id}" data-key="${esc(field.key)}" rows="4">${esc(answerValue(field.key))}</textarea>`
        : `<input id="${id}" type="text" data-key="${esc(field.key)}" value="${esc(answerValue(field.key))}">`;
      const hint=field.hint?`<p class="carry-hint">${esc(field.hint)}</p>`:'';
      const placeholder=field.placeholder?` placeholder="${esc(field.placeholder)}"`:'';
      const enhancedControl=rows>1
        ? `<textarea id="${id}" data-key="${esc(field.key)}" rows="${rows}"${placeholder}>${esc(answerValue(field.key))}</textarea>`
        : `<input id="${id}" type="text" data-key="${esc(field.key)}" value="${esc(answerValue(field.key))}"${placeholder}>`;
      return `<div class="carry-field${field.wide?' wide':''}${field.free?' free-writing':''}"><label for="${id}">${esc(field.label)}</label>${hint}${enhancedControl}</div>`;
    }).join('');
    return `<section class="carry-section"><h3 class="carry-title">${esc(c.carry.title)}</h3><p class="carry-intro">${esc(c.carry.intro)}</p><div class="carry-fields">${fields}</div></section>`;
  }
  function welcomeMarkup(c){
    const resume=hasAnswers()?`<p class="resume">${esc(c.resumeLead)} <a href="#stage-${state.lastStage}">${esc(c.resumeLink)} ${state.lastStage}</a> ${esc(c.resumeTail)}</p>`:'';
    const toc=c.nav.map((item,i)=>`<a href="#stage-${i+1}"><span class="contents-num">0${i+1}</span><span>${esc(item[0])}</span></a>`).join('');
    return `<section class="opening" id="welcome" aria-labelledby="welcome-title">
      <div class="cover">
        <h1 class="cover-title" id="welcome-title">${esc(c.heroTitle)}</h1>
        <div class="cover-main">
          <div class="cover-copy">
            <p class="cover-subtitle">${esc(c.heroSubtitle)}</p>
            <p class="cover-standfirst">${esc(c.intro1)}</p>
            <a class="text-link" href="#stage-1">${esc(c.begin)} <span class="arrow" aria-hidden="true">⟶</span></a>
            ${resume}
          </div>
          <figure class="cover-scene"><img src="${ASSETS.cover}" alt="${esc(c.heroArtLabel)}" fetchpriority="high" decoding="async"></figure>
        </div>
        <div class="cover-bottom">
          <img class="cover-botanical" src="${ASSETS.botanical}" alt="${state.language==='sl'?'Arhivska botanična podoba listov':'Archival botanical study of leaves'}" loading="lazy" decoding="async">
          <div class="cover-intro"><p>${esc(c.intro2)}</p></div>
        </div>
      </div>
      <nav class="contents" aria-label="${esc(c.railLabel)}">${toc}</nav>
    </section>`;
  }
  function stageMarkup(stage,c,index){
    const n=index+1;
    const before=stage.note?noteMarkup(stage.note):'';
    const aside=stage.aside?noteMarkup(stage.aside):'';
    const after=stage.after?noteMarkup(stage.after):'';
    const prompts=stage.prompts.map(prompt=>promptMarkup(prompt,n)).join('');
    const interlude=n===3?`<figure class="image-interlude image-interlude--stone"><img src="${ASSETS.stone}" alt="${state.language==='sl'?'Risba kamna, ki ga je voda skozi čas zgladila':'An engraving of a stone shaped by flowing water over time'}" loading="lazy" decoding="async"></figure>`:'';
    const closingPlate=n===6?`<figure class="image-interlude image-interlude--seed"><img src="${ASSETS.seed}" alt="${state.language==='sl'?'Starinska risba odprtega semenskega stroka':'An archival-style drawing of an opened seed pod'}" loading="lazy" decoding="async"></figure>`:'';
    const integrationPrep=stage.integrationPrep?noteMarkup(stage.integrationPrep):'';
    const carry=n===6?carryMarkup(c):'';
    const safety='';
    const final=n===6?`<p class="final-note"><em>${esc(c.finalEmphasis)}</em> ${esc(c.finalText)}</p><section class="keep-section"><h3>${esc(c.keepTitle)}</h3><p>${esc(c.keepText)}</p><div class="keep-actions"><button class="quiet-action" type="button" data-action="download">${esc(c.export)} ↗</button><button class="quiet-action" type="button" data-action="print">${esc(c.print)}</button><button class="quiet-action" type="button" data-action="clear">${esc(c.clear)}</button></div></section>`:'';
    return `<section class="chapter chapter-${n}" id="stage-${n}" data-stage-view="${n}" aria-labelledby="title-${n}">
      <header class="chapter-head"><span class="chapter-number" aria-hidden="true">0${n}</span><h2 class="chapter-title" id="title-${n}">${esc(stage.title)}</h2><p class="chapter-lead">${esc(stage.lead)}</p></header>
      <div class="chapter-body">${before}${aside}${interlude}<div class="reflection-list">${prompts}</div>${after}${safety}${integrationPrep}${closingPlate}${carry}${final}</div>
    </section>`;
  }
  function footerMarkup(c){
    return `<footer class="publication-footer"><p class="save-state" id="save-state" role="status" aria-live="polite">${esc(state.storageOK?c.saved:c.saveError)}</p><p>${esc(c.privacy)}</p></footer>`;
  }
  function render(){
    const c=currentCopy();
    document.documentElement.lang=state.language;
    document.title=state.language==='sl'?'Pred potjo — prostor za premislek':'Before the journey — space for reflection';
    const skipLink=$('#skip-link'); if(skipLink) skipLink.textContent=c.skip;
    const headerButton=$('.publication-header [data-lang-toggle]');
    if(headerButton){const replacement=document.createElement('span');replacement.innerHTML=languageMarkup(c);headerButton.replaceWith(replacement.firstElementChild);}
    $('#content').innerHTML=welcomeMarkup(c)+c.stages.map((stage,index)=>stageMarkup(stage,c,index)).join('')+footerMarkup(c);
    const dialog=$('#clear-dialog');
    $('#dialog-title').textContent=c.clearDialogTitle;$('#dialog-copy').textContent=c.clearDialogText;
    $('#confirm-clear').textContent=c.clearConfirm;$('#cancel-clear').textContent=c.clearCancel;
    if(!state.storageOK)setSaveStatus(c.saveError,true);
    autoGrowAll();
  }
  function autoGrow(el){if(!el||el.tagName!=='TEXTAREA')return;el.style.height='auto';el.style.height=Math.max(el.scrollHeight,el.dataset.minHeight||0)+'px';}
  function autoGrowAll(){$$('textarea').forEach(el=>{el.dataset.minHeight=el.scrollHeight;autoGrow(el);});}
  function setLanguage(language){
    if(language===state.language)return;
    collectAnswers();clearTimeout(state.saveTimer);state.language=language;
    try{localStorage.setItem(LANGUAGE_KEY,language);}catch(_){state.storageOK=false;}
    saveNow();const y=window.scrollY;render();window.scrollTo({top:y,behavior:'instant'});
  }
  function route(){
    const match=location.hash.match(/^#stage-([1-6])$/);
    if(match){state.lastStage=Number(match[1]);queueSave();}
  }
  function onEdit(event){
    const el=event.target.closest('[data-key]');if(!el)return;
    const key=el.dataset.key;
    if(el.type==='checkbox'){if(el.checked)state.answers[key]=true;else delete state.answers[key];}
    else if(String(el.value??'').trim())state.answers[key]=el.value;else delete state.answers[key];
    if(el.tagName==='TEXTAREA')autoGrow(el);
    queueSave();
  }
  function makeExport(){
    const c=currentCopy();
    const today=new Date().toLocaleDateString(state.language==='sl'?'sl-SI':'en-GB',{year:'numeric',month:'long',day:'numeric'});
    let out=`${c.exportTitle}\n${c.exportSubtitle}\n${c.exportDate}: ${today}\n\n`;
    c.stages.forEach((stage,index)=>{
      out+=`${String(index+1).padStart(2,'0')}  ${stage.title.toLocaleUpperCase(state.language==='sl'?'sl-SI':'en-GB')}\n${'—'.repeat(Math.max(8,stage.title.length))}\n\n`;
      stage.prompts.forEach(prompt=>{out+=`${prompt.text}\n${answerValue(prompt.key).trim()||c.empty}\n\n`;});
      if(stage.aside)out+=`${stage.aside.label}\n${stage.aside.text}\n\n`;
      if(stage.note)out+=`${stage.note.label}\n${stage.note.title?stage.note.title+' ':''}${stage.note.text}\n\n`;
      if(stage.after)out+=`${stage.after.label}\n${stage.after.text}\n\n`;
      if(stage.integrationPrep)out+=`${stage.integrationPrep.label}\n${stage.integrationPrep.text}\n\n`;
      if(index===5){out+=`${c.carry.title.toLocaleUpperCase(state.language==='sl'?'sl-SI':'en-GB')}\n`;c.carry.fields.forEach(field=>{out+=`${field.label}\n${answerValue(field.key).trim()||c.empty}\n\n`;});}
    });
    const earlier=RETIRED_PROMPTS[state.language].filter(([key])=>answerValue(key).trim());
    if(earlier.length){out+=`\n${state.language==='sl'?'DODATNI ZAPISI IZ PREJŠNJE RAZLIČICE':'ADDITIONAL NOTES FROM AN EARLIER VERSION'}\n\n`;earlier.forEach(([key,question])=>{out+=`${question}\n${answerValue(key).trim()}\n\n`;});}
    out+=`\n${c.finalEmphasis} ${c.finalText}\n\n${c.careText}\n`;
    return out;
  }
  function download(){collectAnswers();const blob=new Blob([makeExport()],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=state.language==='sl'?'pred-potjo-zapisi.txt':'before-the-journey-reflections.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);saveNow();}
  function clearAll(){state.answers={};state.lastStage=1;try{localStorage.removeItem(STORAGE_KEY);state.storageOK=true;}catch(_){state.storageOK=false;}render();history.replaceState(null,'',location.pathname+location.search+'#welcome');window.scrollTo(0,0);}

  render();
  document.addEventListener('input',onEdit);document.addEventListener('change',onEdit);
  document.addEventListener('click',event=>{
    const lang=event.target.closest('[data-lang-toggle]');if(lang){setLanguage(state.language==='sl'?'en':'sl');return;}
    const action=event.target.closest('[data-action]')?.dataset.action;
    if(action==='download')download();
    if(action==='print'){collectAnswers();saveNow();window.print();}
    if(action==='clear')$('#clear-dialog').showModal();
  });
  $('#confirm-clear').addEventListener('click',()=>{$('#clear-dialog').close();clearAll();});
  $('#cancel-clear').addEventListener('click',()=>$('#clear-dialog').close());
  $('#clear-dialog').addEventListener('click',event=>{if(event.target===$('#clear-dialog'))$('#clear-dialog').close();});
  window.addEventListener('hashchange',route);
  window.addEventListener('pagehide',()=>{collectAnswers();saveNow();});
  route();
})();
</script>
</body>
</html>
