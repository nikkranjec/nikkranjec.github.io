<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#d8d0c1">
<title>Pred potjo — prostor za premislek</title>
<meta name="description" content="Prostor za oblikovanje namere, notranjo oporo in zaupanje vase.">
<style>
:root{
  color-scheme:light;
  --paper:#d8d0c1;
  --paper-pale:#e5ddce;
  --ink:#1c1a17;
  --ink-soft:#484137;
  --fade:#756d60;
  --rust:#865b43;
  --dark:#1b1a17;
  --dark-paper:#d9d0bf;
  --display:"Bodoni 72", "Didot", "Iowan Old Style", "Times New Roman", serif;
  --text:"Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
  --sans:Arial, Helvetica, sans-serif;
  }
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:1.5rem;-webkit-text-size-adjust:100%}
body{margin:0;background-color:var(--paper);background-image: none;background-size:1536px 1536px;background-repeat:repeat;color:var(--ink);font-family:var(--text);font-size:18px;line-height:1.58;overflow-x:hidden}
body:before{display:none}
a{color:inherit;text-decoration:none}
a:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.22em}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:1px solid var(--rust);outline-offset:5px}
::selection{background:#8e684d;color:#f3ead9}
.vh{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip-link{position:fixed;left:1rem;top:-5rem;z-index:100;background:var(--paper);padding:.5rem 1rem}.skip-link:focus{top:1rem}
.publication-header{position:relative;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1.5rem clamp(1.2rem,4.6vw,5.5rem) 1rem}
.wordmark{font:400 clamp(1rem,1.3vw,1.25rem)/1 var(--display);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.lang-toggle{border:0;background:transparent;padding:.2rem 0;display:flex;align-items:center;gap:.55rem;font:400 .85rem/1 var(--display);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.lang-toggle .current-lang{opacity:.45}.lang-toggle:hover .next-lang{color:var(--rust)}
.publication{width:100%;max-width:1800px;margin:0 auto}
/* COVER: one continuous composition, not a hero card */
.cover{position:relative;padding:clamp(1.8rem,4vw,4.5rem) clamp(1.2rem,4.6vw,5.5rem) 4rem;isolation:isolate}
.cover-title{position:relative;z-index:3;margin:0 0 -.02em -.025em;font:400 clamp(3.1rem,11.1vw,11.6rem)/.82 var(--display);letter-spacing:-.065em;white-space:nowrap;text-transform:none;width:max-content;max-width:100%}
.cover-main{position:relative;display:grid;grid-template-columns:minmax(300px,.72fr) minmax(0,1.28fr);align-items:center;min-height:clamp(560px,58vw,820px);margin-top:-.55rem}
.cover-scene{position:relative;z-index:1;right:auto;top:auto;width:calc(100% + clamp(1.5rem,4vw,4rem));height:clamp(560px,58vw,820px);margin:0 0 0 -3%;overflow:hidden;mix-blend-mode:multiply}
.cover-scene img{width:100%;height:100%;display:block;object-fit:cover;object-position:44% 50%;filter:grayscale(1) contrast(1.09) sepia(.12)}
.cover-scene:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(216,208,193,.10),transparent 33%),linear-gradient(0deg,rgba(216,208,193,.08),transparent 28%);pointer-events:none}
.cover-copy{position:relative;z-index:4;margin:0 -12% 0 11%;width:auto;max-width:34rem;padding:2rem 0 1rem}
.cover-subtitle{margin:0 0 2rem;font:italic 400 clamp(1.35rem,2.2vw,2.25rem)/1.25 var(--display);color:var(--ink-soft);max-width:17em}
.cover-standfirst{max-width:28rem;margin:0 0 2.2rem;font:400 1.03rem/1.65 var(--text);color:var(--ink-soft)}
.text-link{display:inline-flex;align-items:center;gap:1.5rem;padding:.2rem 0 .45rem;border:0;border-bottom:1px solid rgba(28,26,23,.5);background:none;font:400 1.05rem/1.2 var(--display);letter-spacing:.06em}
.text-link .arrow{display:inline-block;transition:transform .35s ease}.text-link:hover .arrow{transform:translateX(7px)}
.resume{margin:1.3rem 0 0;font:italic 400 .95rem/1.5 var(--text);color:var(--fade)}.resume a{text-decoration:underline;text-underline-offset:.2em}
.cover-bottom{position:relative;z-index:2;display:grid;grid-template-columns:minmax(210px,.8fr) minmax(280px,1fr);gap:clamp(2rem,8vw,8rem);align-items:end;margin:clamp(3rem,7vw,7rem) 5% 0 0}
.cover-botanical{width:100%;max-width:400px;height:clamp(260px,35vw,500px);object-fit:cover;object-position:center 34%;display:block;mix-blend-mode:multiply;filter:grayscale(1) contrast(1.08);transform:rotate(-1.3deg)}
.cover-intro{max-width:35rem;padding:0 0 2rem}.cover-intro p{margin:0 0 1.1rem}.cover-intro p:first-child{font:italic 400 clamp(1.3rem,2vw,1.85rem)/1.35 var(--display);color:var(--ink-soft)}
.care-copy{max-width:46rem;margin:2rem auto 0;padding:1.5rem 0 0;border-top:1px solid rgba(28,26,23,.27);font:400 .93rem/1.7 var(--sans);color:var(--fade)}
/* contents are simple text, not a component menu */
.contents{margin:clamp(5rem,10vw,10rem) clamp(1.2rem,8vw,9rem) clamp(5rem,10vw,10rem);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:2rem;row-gap:1.3rem}
.contents a{display:flex;gap:.9rem;align-items:baseline;font:400 clamp(1rem,1.4vw,1.25rem)/1.25 var(--display);padding-bottom:.25rem}
.contents .contents-num{font:400 .68rem/1 var(--sans);color:var(--rust);letter-spacing:.1em}
/* Long-form chapters */
.chapter{position:relative;padding:clamp(6rem,11vw,11rem) clamp(1.2rem,8vw,9rem) clamp(6rem,10vw,10rem);scroll-margin-top:1rem}
.chapter-head{position:relative;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(250px,.75fr);gap:clamp(2rem,7vw,7rem);align-items:end;margin:0 auto clamp(5rem,9vw,9rem);max-width:1450px}
.chapter-number{position:absolute;top:-.9em;left:-.045em;z-index:0;color:rgba(28,26,23,.075);font:400 clamp(10rem,26vw,27rem)/.7 var(--display);letter-spacing:-.08em;pointer-events:none;user-select:none}
.chapter-title{position:relative;z-index:1;margin:0;font:400 clamp(3.5rem,7.8vw,8.6rem)/.86 var(--display);letter-spacing:-.06em;max-width:10ch}
.chapter-lead{position:relative;z-index:1;margin:0 0 .2rem;max-width:34rem;color:var(--ink-soft);font:400 clamp(1.05rem,1.45vw,1.3rem)/1.62 var(--text)}
.chapter-body{max-width:1160px;margin:0 auto}
/* Notes and pull quotes: typography in the page, never boxed */
.editorial-note{width:min(43rem,76%);margin:0 7% clamp(5rem,9vw,9rem) auto;color:var(--ink-soft)}
.editorial-note .note-title{display:block;margin:0 0 .7rem;font:italic 400 clamp(1.65rem,3vw,3rem)/1.1 var(--display);color:var(--rust)}
.editorial-note p{margin:0;font:400 1.05rem/1.7 var(--text)}
.editorial-note:empty{display:none}
/* Reflection writing: no cards, no boxes, no form-dashboard language */
.reflection-list{max-width:1080px;margin:0 auto}
.reflection{display:grid;grid-template-columns:minmax(260px,.86fr) minmax(300px,1.14fr);gap:clamp(1.8rem,5vw,5.5rem);align-items:start;margin:0 0 clamp(4.5rem,8vw,8rem)}
.reflection:nth-child(even){margin-left:5%;}
.reflection-heading{display:grid;grid-template-columns:2.1rem minmax(0,1fr);gap:.7rem;align-items:start}
.question-number{padding-top:.35rem;color:var(--rust);font:400 .68rem/1.2 var(--sans);letter-spacing:.08em}
.question-title{margin:0;font:400 clamp(1.35rem,2.2vw,2.05rem)/1.22 var(--display);letter-spacing:-.018em}
.question-hint{margin:.8rem 0 0;color:var(--fade);font:italic 400 .95rem/1.5 var(--text)}
.answer-wrap{position:relative;margin-top:.15rem;min-height:8.8rem;background:none}
.answer-wrap:focus-within{background:none}
.answer-wrap textarea,.carry-field textarea,.carry-field input{display:block;width:100%;min-height:8.8rem;resize:none;overflow:hidden;padding:.15rem 0 .4rem;border:0;border-radius:0;outline:none;background:transparent;color:var(--ink);font:400 1rem/2.29rem var(--text);box-shadow:none;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(2.29rem - 1px),rgba(54,48,39,.2) calc(2.29rem - 1px),rgba(54,48,39,.2) 2.29rem);background-size:100% 2.29rem;background-position:0 .1rem}
.answer-wrap textarea:focus,.carry-field textarea:focus,.carry-field input:focus{outline:none}
.answer-wrap textarea::placeholder,.carry-field textarea::placeholder,.carry-field input::placeholder{color:transparent}
.answer-wrap:after{content:"";position:absolute;left:0;right:0;top:-.4rem;height:1px;background:transparent;transition:background .2s ease}
.answer-wrap:focus-within:after{background:var(--rust)}
.chapter-2{padding-top:clamp(7rem,13vw,13rem)}
.chapter-2 .chapter-title{max-width:9ch}
.chapter-2 .reflection:first-child{display:block;max-width:900px;margin:0 auto clamp(5rem,10vw,10rem) 8%}
.chapter-2 .reflection:first-child .question-title{font-size:clamp(2rem,4vw,4rem);max-width:19ch}
.chapter-2 .reflection:first-child .answer-wrap{width:82%;margin:2rem 0 0 auto}
.chapter-2 .reflection:nth-child(odd){transform:translateX(3%)}
.chapter-3{background-color:var(--dark);background-image: none;background-size:1536px 1536px;background-repeat:repeat;color:var(--dark-paper);padding-top:clamp(7rem,13vw,13rem);padding-bottom:clamp(8rem,14vw,14rem);overflow:hidden}
.chapter-3:after{display:none}
.chapter-3 .chapter-number{color:rgba(230,221,203,.07)}
.chapter-3 .chapter-lead,.chapter-3 .editorial-note{color:#c3b9a8}
.chapter-3 .editorial-note .note-title{color:#c08c69}
.chapter-3 .question-number{color:#c08c69}
.chapter-3 .question-title{color:#e5dccd}
.chapter-3 .question-hint{color:#aaa08f}
.chapter-3 .answer-wrap{background:none}
.chapter-3 .answer-wrap:focus-within{background:none}
.chapter-3 .answer-wrap textarea,.chapter-3 .carry-field textarea,.chapter-3 .carry-field input{color:#e5dccd;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(2.29rem - 1px),rgba(230,220,203,.25) calc(2.29rem - 1px),rgba(230,220,203,.25) 2.29rem)}
.chapter-4{padding-top:clamp(8rem,13vw,13rem)}
.chapter-4 .chapter-head{grid-template-columns:minmax(0,1fr) minmax(260px,.7fr)}
.chapter-4 .chapter-title{max-width:8ch}
.chapter-4 .reflection{display:block;max-width:850px;margin-left:10%}
.chapter-4 .reflection .answer-wrap{width:76%;margin:1.4rem 0 0 auto}
.chapter-5{padding-top:clamp(5rem,8vw,8rem);padding-bottom:clamp(6rem,9vw,9rem)}
.chapter-5 .chapter-number{font-size:clamp(8rem,18vw,18rem)}
.chapter-5 .reflection{margin-bottom:3.5rem}
.chapter-5 .care-copy{max-width:48rem;margin:5rem 0 0 auto;padding-top:1.3rem;border-top:1px solid rgba(28,26,23,.24);font:400 .88rem/1.65 var(--sans);color:var(--fade)}
.chapter-6{padding-top:clamp(8rem,14vw,14rem);padding-bottom:clamp(7rem,12vw,12rem)}
.chapter-6 .chapter-title{max-width:8ch;font-size:clamp(4.5rem,9vw,9rem)}
.chapter-6 .chapter-lead{font-style:italic}
/* A botanical plate interrupts the reading rhythm, without becoming a card */
.image-interlude{position:relative;margin:clamp(2rem,7vw,7rem) -8vw clamp(5rem,10vw,10rem);min-height:clamp(280px,48vw,680px);overflow:hidden;isolation:isolate}
.image-interlude img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 38%;filter:grayscale(1) contrast(1.04);mix-blend-mode:multiply;opacity:.94}
.image-interlude figcaption{position:absolute;bottom:1.2rem;right:1.7rem;color:rgba(28,26,23,.7);font:italic 400 .9rem var(--display)}
/* Closing note / actions as a quiet colophon */
.carry-section{position:relative;margin:clamp(5rem,9vw,9rem) 0 0;padding:clamp(2rem,5vw,5rem) 0 0}
.carry-title{margin:0 0 1rem;font:italic 400 clamp(2.3rem,4.5vw,4.7rem)/1.05 var(--display);letter-spacing:-.035em}
.carry-intro{max-width:40rem;margin:0 0 3rem;color:var(--ink-soft);font:400 1.02rem/1.6 var(--text)}
.carry-fields{display:grid;grid-template-columns:1fr 1fr;gap:2rem 4rem}
.carry-field label{display:block;margin:0 0 .4rem;font:italic 400 1.15rem/1.2 var(--display);color:var(--rust)}
.carry-field textarea,.carry-field input{min-height:5rem;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 2.28rem,rgba(54,48,39,.15) 2.28rem,rgba(54,48,39,.15) calc(2.28rem + 1px));background-position:0 2.1rem}
.carry-field.wide{grid-column:1/-1}
.final-note{max-width:48rem;margin:5rem 0 0;font:italic 400 clamp(1.5rem,2.6vw,2.5rem)/1.35 var(--display);color:var(--rust)}
.keep-section{margin:clamp(7rem,12vw,12rem) 0 0;padding:2rem 0 0;border-top:1px solid rgba(28,26,23,.3)}
.keep-section h3{margin:0 0 1rem;font:400 clamp(2rem,4vw,3.7rem)/1 var(--display)}
.keep-section p{max-width:38rem;color:var(--fade);font:400 .92rem/1.65 var(--sans)}
.keep-actions{display:flex;flex-wrap:wrap;gap:1.3rem 2rem;margin-top:2rem}
.quiet-action{border:0;border-bottom:1px solid rgba(28,26,23,.5);padding:0 0 .3rem;background:transparent;font:400 .95rem/1.25 var(--text);text-align:left}
.quiet-action:hover{color:var(--rust)}
.publication-footer{display:flex;justify-content:space-between;gap:2rem;align-items:flex-end;margin:0 clamp(1.2rem,8vw,9rem);padding:2rem 0 3.5rem;color:var(--fade);font:400 .76rem/1.5 var(--sans)}
.publication-footer p{margin:0;max-width:36rem}.save-state[data-error="true"]{color:#8b3f30}
.dialog{max-width:32rem;width:calc(100% - 2rem);padding:2.2rem;border:0;border-top:1px solid rgba(28,26,23,.45);background-color:var(--paper-pale);background-image:none;color:var(--ink);box-shadow:0 20px 70px rgba(0,0,0,.25)}
.dialog::backdrop{background:rgba(17,16,14,.72)}.dialog h3{margin:0 0 1rem;font:400 2rem/1.1 var(--display)}.dialog p{font:400 .95rem/1.6 var(--text);color:var(--ink-soft)}
.dialog-actions{display:flex;gap:1.5rem;flex-wrap:wrap;margin-top:2rem}
/* Print should read like a manuscript, not like an app screenshot. */
@media print{
  @page{margin:18mm}
  body{background:#fff;color:#111;font-size:11pt}
  body:before,.publication-header .lang-toggle,.cover .text-link,.keep-actions,.publication-footer,.contents{display:none!important}
  .cover{min-height:0;break-after:page;padding:0 0 15mm}
  .cover-scene{position:relative;top:auto;right:auto;width:100%;height:110mm;margin:12mm 0}
  .cover-title{font-size:65pt;white-space:normal}
  .chapter{padding:18mm 0;break-before:page}
  .chapter-number{font-size:100pt}
  .chapter-3{background:#fff;color:#111}
  .chapter-3 .chapter-title,.chapter-3 .question-title,.chapter-3 .chapter-lead,.chapter-3 .question-hint{color:#111}
  .chapter-3 .answer-wrap{background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 2.28rem,#ccc 2.28rem,#ccc calc(2.28rem + 1px))}
  .answer-wrap textarea{min-height:30mm}
  .reflection{break-inside:avoid}
  .image-interlude{break-inside:avoid;min-height:50mm}
  .dialog{display:none}
}
@media(max-width:900px){
  .cover{padding-top:2rem}
  .cover-main{grid-template-columns:minmax(240px,.76fr) minmax(0,1.24fr);min-height:clamp(500px,65vw,680px)}
  .cover-scene{width:calc(100% + 4vw);height:clamp(500px,65vw,680px);min-height:0}
  .cover-copy{margin-left:5%;padding-right:0}
  .cover-title{font-size:clamp(3.3rem,11.2vw,7rem)}
  .cover-bottom{margin-top:clamp(3rem,8vw,6rem);grid-template-columns:minmax(180px,.8fr) minmax(240px,1fr);gap:2.5rem}
  .chapter{padding-left:6vw;padding-right:6vw}
  .chapter-head{grid-template-columns:1fr .8fr;gap:2.5rem}
  .chapter-title{font-size:clamp(3.7rem,8.6vw,6.5rem)}
  .reflection{grid-template-columns:minmax(220px,.9fr) minmax(250px,1.1fr);gap:2rem}
  .image-interlude{margin-left:-6vw;margin-right:-6vw}
}

/* Symbolic archival plates: artwork sits directly on the paper, without a card or frame. */
.image-interlude--stone{min-height:0;max-height:none;height:auto;margin:clamp(2.2rem,6vw,6rem) -2vw clamp(3.8rem,8vw,8rem) 6%;overflow:visible;}
.image-interlude--stone img{position:relative;inset:auto;display:block;width:min(100%,1050px);height:auto;max-height:none;object-fit:contain;object-position:center;mix-blend-mode:screen;filter:none;opacity:.72;transform:rotate(-1.2deg);}
.image-interlude--seed{min-height:0;max-height:none;height:auto;width:min(75%,760px);margin:clamp(2rem,5vw,5rem) 2% clamp(3rem,7vw,7rem) auto;overflow:visible;}
.image-interlude--seed img{position:relative;inset:auto;display:block;width:100%;height:auto;max-height:none;object-fit:contain;object-position:center;mix-blend-mode:multiply;filter:sepia(.13) grayscale(.88) contrast(1.06);opacity:.82;transform:rotate(1.5deg);}
.chapter-3 .image-interlude--stone{margin-left:3%;margin-right:-4%;}
.carry-hint{max-width:38rem;margin:.25rem 0 .7rem;color:var(--fade);font:italic 400 .9rem/1.5 var(--text);}
.carry-field.free-writing textarea{min-height:clamp(13rem,24vw,19rem);height:clamp(13rem,24vw,19rem);padding:.15rem 0 .4rem;line-height:2.35rem;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(2.35rem - 1px),rgba(54,48,39,.28) calc(2.35rem - 1px),rgba(54,48,39,.28) 2.35rem);background-size:100% 2.35rem;background-position:0 .1rem;}
.carry-field.free-writing textarea::placeholder{color:rgba(72,65,55,.38);font-style:italic;}
.carry-field:not(.free-writing) textarea,.carry-field input{background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(2.28rem - 1px),rgba(54,48,39,.22) calc(2.28rem - 1px),rgba(54,48,39,.22) 2.28rem);}
@media(max-width:640px){
  .image-interlude--stone{margin:2rem -1.1rem 3.8rem 4%;}
  .image-interlude--stone img{width:100%;}
  .image-interlude--seed{width:88%;margin:2rem -1.1rem 3.4rem auto;}
  .carry-field.free-writing textarea{height:15rem;min-height:15rem;line-height:2.25rem;background-size:100% 2.25rem;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(2.25rem - 1px),rgba(54,48,39,.3) calc(2.25rem - 1px),rgba(54,48,39,.3) 2.25rem);}
}

@media(max-width:640px){
  body{font-size:16px;line-height:1.58}
  .publication-header{padding:1rem 1.1rem .65rem}
  .wordmark{font-size:1rem;letter-spacing:.1em}
  .lang-toggle{font-size:.78rem}
  .cover{padding:2rem 1.1rem 3rem}
  .cover-title{font-size:clamp(2.85rem,13.2vw,5.2rem);line-height:.9;letter-spacing:-.065em;white-space:nowrap}
  .cover-main{display:flex;flex-direction:column;align-items:stretch;min-height:0;margin-top:1.6rem}
  .cover-scene{order:1;width:calc(100% + 2.2rem);height:clamp(350px,112vw,560px);margin:0 -1.1rem;overflow:hidden}
  .cover-scene img{object-position:41% 48%}
  .cover-copy{order:2;margin:1.7rem 0 0 4%;width:min(90%,25rem);max-width:none;padding:0}
  .cover-subtitle{font-size:1.55rem;margin-bottom:1.1rem;max-width:19em}
  .cover-standfirst{font-size:.98rem;margin-bottom:1.4rem}
  .cover-bottom{grid-template-columns:.72fr 1fr;gap:1.15rem;margin:3.8rem 0 0}
  .cover-botanical{height:clamp(205px,66vw,330px);object-position:50% 30%}
  .cover-intro{padding:0 0 .5rem}.cover-intro p{font-size:.93rem}.cover-intro p:first-child{font-size:1.2rem}
  .care-copy{margin-top:2rem;padding-top:1.1rem;font-size:.82rem}
  .contents{margin:4rem 1.1rem 4.5rem;grid-template-columns:1fr 1fr;gap:1rem 1.2rem}
  .contents a{font-size:1.02rem;gap:.55rem}
  .chapter{padding:5rem 1.1rem 5rem}
  .chapter-head{display:block;margin-bottom:3.5rem}
  .chapter-number{top:-.75em;left:-.05em;font-size:clamp(8rem,34vw,13rem)}
  .chapter-title{font-size:clamp(3.3rem,14vw,5.4rem);max-width:10ch;line-height:.9}
  .chapter-lead{margin:2rem 0 0 15%;font-size:1rem;max-width:31rem}
  .editorial-note{width:88%;margin:0 0 3.5rem auto}
  .editorial-note .note-title{font-size:1.75rem}
  .editorial-note p{font-size:.97rem}
  .reflection{display:block;margin:0 0 3.8rem!important;transform:none!important}
  .reflection-heading{grid-template-columns:1.7rem 1fr;gap:.45rem}
  .question-title{font-size:1.42rem;line-height:1.25}

      intro1: 'An intention does not dictate the course of an experience. It is an honest question that helps you understand what is alive in you and where you want to place your attention.',
      intro2: 'This guide is not a test of readiness. It is here to help you hear yourself more clearly: what is calling, what needs care, where your boundaries are, and how you can support yourself. Take your time. You do not need to arrive at a final answer.',
      careTitle: 'A note on care.',
      careText: 'Your attention, expectations and ways of responding may influence how you relate to what happens, but they cannot reliably control the course of an experience. This guide is not a medical assessment and cannot establish that an experience is safe or appropriate for you. Speak with a qualified healthcare professional about health questions. Postponing or deciding not to continue are both valid choices.',
      meta: [['PACE', 'Six chapters. Take the time you need.'], ['PRIVACY', 'Notes stay in this browser unless you choose to export them.'], ['APPROACH', 'You do not have to prove or control anything.']],
      begin: 'Begin', resumeLead: 'There are notes saved on this device.', resumeLink: 'Return to passage', resumeTail: 'or begin again.',
      stageLabel: 'CHAPTER', of: 'OF', previous: '← PREVIOUS CHAPTER', introduction: '← INTRODUCTION', continue: 'CONTINUE', takeTime: 'TAKE YOUR TIME',
      noteLabels: {
        distinction: 'From outcome to question', grounding: 'There is no single correct mindset', practical: 'Practical matters in the background', professional: 'Speak with a professional', remember: 'Keep in mind'
      },
      stages: [
        {
          title: 'What brought me here?',
          lead: 'Before thinking about where you want to go, pause with what brought you here. Begin with the circumstances around this choice, not the story you think you should tell.',
          prompts: [
            { key:'1.1', text:'What has brought me to consider this experience at this point in my life?', hint:'Start wherever the answer feels most honest.', placeholder:'I find myself here because …' },
            { key:'1.2', text:'What has been asking for my attention lately — a change, a loss, a question or a recurring pattern?', placeholder:'Something I keep returning to …' },
            { key:'1.3', text:'What do I want to understand, explore or make more room for?', placeholder:'I am curious about …' },
            { key:'1.4', text:'Does this feel like my own choice? Is there pressure, urgency or a wish to escape something that I should acknowledge?', placeholder:'What feels freely chosen — and what feels complicated …' }
          ]
        },
        {
          title: 'Shaping an intention',
          lead: 'An intention is not a goal you have to achieve. It is a question that helps you recognise what you want to explore. It does not have to be grand, perfect or final. It only needs to be honest, personally meaningful and open enough not to dictate what you must experience.',
          aside: { label:'From outcome to question', text:'“I want to get rid of my anxiety” demands a particular outcome. “What might help me understand my anxiety and meet it with more kindness?” opens a space for exploration. Try beginning with “What do I want to understand …?” or “How might I relate differently to …?”. No wording guarantees an outcome; a useful intention simply names a direction.' },
          prompts: [
            { key:'2.1', text:'If I set aside the outcome I hope for, what question feels worth bringing with me?', placeholder:'A question I want to stay curious about …' },
            { key:'2.2', text:'Write a first draft of my intention exactly as it comes. It does not need to sound wise or polished.', placeholder:'My first words …' },
            { key:'2.3', text:'Which part of my life, a relationship or my inner world does this intention touch?', placeholder:'This connects to …' },
            { key:'2.4', text:'How can I hold this intention as an open question and leave room for the possibility that I may not get an answer?', placeholder:'A way to leave room for the unexpected …' },
            { key:'2.5', text:'Why does this question matter to me now? What need, value or longing might sit beneath it?', placeholder:'What matters underneath this is …' },
            { key:'2.6', text:'Which parts of this intention truly come from me — and which might be borrowed from other people’s expectations, stories or wishes?', placeholder:'What feels like mine …; what may have been borrowed …' }
          ]
        },
        {
          title: 'How can I support myself?',
          lead: 'Inner support is not the belief that you can handle everything or stay in control. It is trusting that you can listen to yourself, recognise your limits and treat yourself with care. Your thoughts, expectations and attention can influence how you experience and respond to what happens. They cannot determine everything that arises or guarantee control over the experience.',
          aside: { label:'Not today. I would like a pause.', text:'You cannot choose everything that arises, but you can think beforehand about how you would like to respond. If you meet something you do not want to explore today, you do not have to push further or prove your courage. You can say: “Not today. I would like a pause.” You might open your eyes, look around the room, feel your feet on the floor, or turn your attention towards a familiar sound, object or conversation. Redirecting attention is not a switch, and it does not guarantee that a feeling will disappear immediately. It does mean you can express what you need and take part in caring for yourself. Even when you cannot steer the experience, you can stay on your own side.' },
          prompts: [
            { key:'3.1', text:'How have I been feeling over the last few weeks — emotionally, physically and in everyday life? What might my state be telling me?', placeholder:'Lately, I have been noticing …' },
            { key:'3.2', text:'Are there changes, losses, prolonged stress or other circumstances in my life that deserve attention before I decide?', placeholder:'Things I want to take seriously …' },
            { key:'3.3', text:'What am I afraid might come up? How do I usually respond when strong emotions or uncertainty overwhelm me — and what signs tell me that something is becoming too much?', placeholder:'When things become difficult or I approach my limit, I notice …' },
            { key:'3.4', text:'What helps me reconnect with the present moment? Which familiar sound, object, bodily sensation, place or thought might offer a point of support?', placeholder:'Things that help me feel grounded include …' },
            { key:'3.5', text:'What kind of experience am I expecting? How might my expectations and the way I interpret what is happening shape how I experience and respond to it — and where does my influence end?', placeholder:'I expect …; I want to meet what happens with …; what I cannot control is …' },
            { key:'3.6', text:'What words might help me in a moment of fear or feeling lost? What would be worth reminding myself of then?', placeholder:'I can remind myself …' },
            { key:'3.7', text:'If something came up that I do not want to explore today, how could I give myself permission to step back? What words could I use to ask for a pause or gently redirect my attention?', hint:'You do not have to explain or justify your boundary.', placeholder:'“Not today. I would like a pause. I want to turn my attention towards something familiar.”' }
          ]
        },
        {
          title: 'Boundaries, choice and support',
          lead: 'Your connection with yourself comes first: your needs, your boundaries and your right to change your mind. Another person can offer additional support, but they should not decide for you what you must endure.',
          aside: { label:'My voice matters', text:'If another person will be with you, agree in advance how you can clearly communicate that you want a pause, a change or an end. Their role is not to persuade you to push through, but to respect your boundaries and seek appropriate help in an emergency.' },
          prompts: [
            { key:'4.1', text:'What kind of space and basic conditions would help me feel sufficiently safe and free from unnecessary pressure?', placeholder:'The conditions I would need …' },
            { key:'4.2', text:'Who will be present, and what will their role be? Can I clearly express what I need — including a pause, a change or an end — and trust that it will be respected without pressure?', placeholder:'What I want to clarify with the person supporting me …' }
          ]
        },
        {
          title: 'Health and the decision',
          lead: 'Some questions need professional answers, not reflection alone. It is okay to leave uncertainty on the page; you do not have to cover it with a feeling that the decision must already be made.',
          note: { label:'Speak with a professional', title:'Qualified health guidance matters.', text:'Psychedelics can carry psychological and physical risks and may interact with medications or health conditions. Before making a decision, discuss your personal and family psychiatric history, current health and all medications with a qualified healthcare professional. Do not stop, start or change medication on your own.' },
          prompts: [
            { key:'5.1', text:'Have I discussed relevant health questions, psychiatric history and current medications with a qualified healthcare professional?', placeholder:'What has been discussed, and what still needs a professional answer …' },
            { key:'5.2', text:'What health or legal questions remain unanswered? Which qualified professional or reliable official source can help me find clear answers?', placeholder:'Questions I need to clarify, and a reliable source I can turn to …' },
            { key:'5.5', text:'What circumstances would make postponing or deciding not to proceed the most caring choice?', placeholder:'Reasons I would take seriously …' }
          ],
          after: { label:'Keep in mind', text:'This guide does not provide medical clearance, a risk score, substance-use instructions or legal advice. If a healthcare professional advises against proceeding, take that advice seriously. If the setting, support or consent arrangements do not feel safe, you can step away.' },
          integrationPrep: { label:'Make room for the days afterwards', text:'It is worth thinking about the days after the experience before they arrive. Give yourself time to rest, write things down and reflect without rushing. You do not need to understand everything straight away or turn every impression into a conclusion or decision. You can return to your notes a few days later and talk them through with someone you trust. In your own time, consider what still feels meaningful, what you may want to bring into everyday life and what you can leave aside. This part of the process needs room too.' }
        },
        {
          title: 'Returning to everyday life',
          lead: 'An experience does not necessarily end when the day ends. Any meaning it may hold is made in the life around it — slowly, with support, discernment and room for ordinary things.',
          prompts: [
            { key:'6.1', text:'Who could listen without rushing to interpret, judge or fix what I share?', placeholder:'People I could turn to …' },
            { key:'6.3', text:'Would a therapist, integration professional or another trusted support person be useful? How and when could I reach them?', placeholder:'A person or next step …' },
            { key:'6.4', text:'What time and space could I protect for rest and reflection? What is one small, grounded action that might help bring something meaningful into everyday life — without making major decisions too quickly?', placeholder:'Space for rest and a small step, when the time is right …' },
            { key:'6.5', text:'If I feel unsettled, confused or distressed afterwards, what can I do and whom can I contact?', placeholder:'My plan for reaching support …' }
          ]
        }
      ],

  };
  function currentCopy(){ return COPY[state.language]; }
  function esc(value){ return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
  function answerValue(key){ return typeof state.answers[key] === 'string' ? state.answers[key] : ''; }
  function hasAnswers(){ return Object.values(state.answers).some(value => typeof value === 'string' ? value.trim() : Boolean(value)); }
  function setSaveStatus(message, isError=false){ const el=$('#save-state'); if(!el)return; el.textContent=message; el.dataset.error=isError?'true':'false'; }
  function saveNow(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify({answers:state.answers,lastStage:state.lastStage})); state.storageOK=true; setSaveStatus(currentCopy().saved); }
    catch(_){ state.storageOK=false; setSaveStatus(currentCopy().saveError,true); }
  }
  function queueSave(){ setSaveStatus(currentCopy().saving); clearTimeout(state.saveTimer); state.saveTimer=setTimeout(saveNow,350); }
  function collectAnswers(){
    $$('[data-key]').forEach(el=>{ const key=el.dataset.key; if(el.type==='checkbox'){ if(el.checked)state.answers[key]=true; else delete state.answers[key]; } else if(String(el.value??'').trim())state.answers[key]=el.value; else delete state.answers[key]; });
  }
  try{
    const saved=localStorage.getItem(STORAGE_KEY);
    if(saved){const parsed=JSON.parse(saved);if(parsed&&parsed.answers&&typeof parsed.answers==='object'){state.answers=parsed.answers;state.lastStage=Number.isInteger(parsed.lastStage)?Math.min(6,Math.max(1,parsed.lastStage)):1;}}
    const lang=localStorage.getItem(LANGUAGE_KEY); if(lang==='sl'||lang==='en')state.language=lang;
  }catch(_){state.storageOK=false;}

  function languageMarkup(c){
    const current=state.language.toUpperCase(), next=state.language==='sl'?'EN':'SL';
    return `<button class="lang-toggle" type="button" data-lang-toggle aria-label="${esc(c.switchLabel)}"><span class="current-lang">${current}</span><span aria-hidden="true">/</span><span class="next-lang">${next}</span></button>`;
  }
  function noteMarkup(note){
    if(!note)return '';
    const title=note.title || note.label || '';
    return `<aside class="editorial-note">${title?`<span class="note-title">${esc(title)}</span>`:''}<p>${esc(note.text)}</p></aside>`;
  }
  function promptMarkup(prompt, stage){
    const id=`field-${prompt.key.replace('.','-')}`;
    const number=prompt.key;
    return `<article class="reflection">
      <div class="reflection-heading"><span class="question-number">${esc(number)}</span><div><h3 class="question-title" id="label-${id}">${esc(prompt.text)}</h3>${prompt.hint?`<p class="question-hint">${esc(prompt.hint)}</p>`:''}</div></div>
      <div class="answer-wrap"><label class="vh" for="${id}">${esc(prompt.text)}</label><textarea id="${id}" data-key="${esc(prompt.key)}" rows="4" spellcheck="true" aria-labelledby="label-${id}">${esc(answerValue(prompt.key))}</textarea></div>
    </article>`;
  }
  function carryMarkup(c){
    const fields=c.carry.fields.map(field=>{
      const id=`field-${field.key.replace('.','-')}`;
      const rows=field.rows||1;
      const control=rows>1
        ? `<textarea id="${id}" data-key="${esc(field.key)}" rows="4">${esc(answerValue(field.key))}</textarea>`
        : `<input id="${id}" type="text" data-key="${esc(field.key)}" value="${esc(answerValue(field.key))}">`;
      const hint=field.hint?`<p class="carry-hint">${esc(field.hint)}</p>`:'';
      const placeholder=field.placeholder?` placeholder="${esc(field.placeholder)}"`:'';
      const enhancedControl=rows>1
        ? `<textarea id="${id}" data-key="${esc(field.key)}" rows="${rows}"${placeholder}>${esc(answerValue(field.key))}</textarea>`
        : `<input id="${id}" type="text" data-key="${esc(field.key)}" value="${esc(answerValue(field.key))}"${placeholder}>`;
      return `<div class="carry-field${field.wide?' wide':''}${field.free?' free-writing':''}"><label for="${id}">${esc(field.label)}</label>${hint}${enhancedControl}</div>`;
    }).join('');
    return `<section class="carry-section"><h3 class="carry-title">${esc(c.carry.title)}</h3><p class="carry-intro">${esc(c.carry.intro)}</p><div class="carry-fields">${fields}</div></section>`;
  }
  function welcomeMarkup(c){
    const resume=hasAnswers()?`<p class="resume">${esc(c.resumeLead)} <a href="#stage-${state.lastStage}">${esc(c.resumeLink)} ${state.lastStage}</a> ${esc(c.resumeTail)}</p>`:'';
    const toc=c.nav.map((item,i)=>`<a href="#stage-${i+1}"><span class="contents-num">0${i+1}</span><span>${esc(item[0])}</span></a>`).join('');
    return `<section class="opening" id="welcome" aria-labelledby="welcome-title">
      <div class="cover">
        <h1 class="cover-title" id="welcome-title">${esc(c.heroTitle)}</h1>
        <div class="cover-main">
          <div class="cover-copy">
            <p class="cover-subtitle">${esc(c.heroSubtitle)}</p>
            <p class="cover-standfirst">${esc(c.intro1)}</p>
            <a class="text-link" href="#stage-1">${esc(c.begin)} <span class="arrow" aria-hidden="true">⟶</span></a>
            ${resume}
          </div>
          <figure class="cover-scene"><img src="${ASSETS.cover}" alt="${esc(c.heroArtLabel)}" fetchpriority="high" decoding="async"></figure>
        </div>
        <div class="cover-bottom">
          <img class="cover-botanical" src="${ASSETS.botanical}" alt="${state.language==='sl'?'Arhivska botanična podoba listov':'Archival botanical study of leaves'}" loading="lazy" decoding="async">
          <div class="cover-intro"><p>${esc(c.intro2)}</p></div>
        </div>
      </div>
      <nav class="contents" aria-label="${esc(c.railLabel)}">${toc}</nav>
    </section>`;
  }
  function stageMarkup(stage,c,index){
    const n=index+1;
    const before=stage.note?noteMarkup(stage.note):'';
    const aside=stage.aside?noteMarkup(stage.aside):'';
    const after=stage.after?noteMarkup(stage.after):'';
    const prompts=stage.prompts.map(prompt=>promptMarkup(prompt,n)).join('');
    const interlude='';
    const closingPlate='';
    const integrationPrep=stage.integrationPrep?noteMarkup(stage.integrationPrep):'';
    const carry=n===6?carryMarkup(c):'';
    const safety='';
    const final=n===6?`<p class="final-note"><em>${esc(c.finalEmphasis)}</em> ${esc(c.finalText)}</p><section class="keep-section"><h3>${esc(c.keepTitle)}</h3><p>${esc(c.keepText)}</p><div class="keep-actions"><button class="quiet-action" type="button" data-action="download">${esc(c.export)} ↗</button><button class="quiet-action" type="button" data-action="print">${esc(c.print)}</button><button class="quiet-action" type="button" data-action="clear">${esc(c.clear)}</button></div></section>`:'';
    return `<section class="chapter chapter-${n}" id="stage-${n}" data-stage-view="${n}" aria-labelledby="title-${n}">
      <header class="chapter-head"><span class="chapter-number" aria-hidden="true">0${n}</span><h2 class="chapter-title" id="title-${n}">${esc(stage.title)}</h2><p class="chapter-lead">${esc(stage.lead)}</p></header>
      <div class="chapter-body">${before}${aside}${interlude}<div class="reflection-list">${prompts}</div>${after}${safety}${integrationPrep}${closingPlate}${carry}${final}</div>
    </section>`;
  }
  function footerMarkup(c){
    return `<footer class="publication-footer"><p class="save-state" id="save-state" role="status" aria-live="polite">${esc(state.storageOK?c.saved:c.saveError)}</p><p>${esc(c.privacy)}</p></footer>`;
  }
  function render(){
    const c=currentCopy();
    document.documentElement.lang=state.language;
    document.title=state.language==='sl'?'Pred potjo — prostor za premislek':'Before the journey — space for reflection';
    const skipLink=$('#skip-link'); if(skipLink) skipLink.textContent=c.skip;
    const headerButton=$('.publication-header [data-lang-toggle]');
    if(headerButton){const replacement=document.createElement('span');replacement.innerHTML=languageMarkup(c);headerButton.replaceWith(replacement.firstElementChild);}
    $('#content').innerHTML=welcomeMarkup(c)+c.stages.map((stage,index)=>stageMarkup(stage,c,index)).join('')+footerMarkup(c);
    const dialog=$('#clear-dialog');
    $('#dialog-title').textContent=c.clearDialogTitle;$('#dialog-copy').textContent=c.clearDialogText;
    $('#confirm-clear').textContent=c.clearConfirm;$('#cancel-clear').textContent=c.clearCancel;
    if(!state.storageOK)setSaveStatus(c.saveError,true);
    autoGrowAll();
  }
  function autoGrow(el){if(!el||el.tagName!=='TEXTAREA')return;el.style.height='auto';el.style.height=Math.max(el.scrollHeight,el.dataset.minHeight||0)+'px';}
  function autoGrowAll(){$$('textarea').forEach(el=>{el.dataset.minHeight=el.scrollHeight;autoGrow(el);});}
  function setLanguage(language){
    if(language===state.language)return;
    collectAnswers();clearTimeout(state.saveTimer);state.language=language;
    try{localStorage.setItem(LANGUAGE_KEY,language);}catch(_){state.storageOK=false;}
    saveNow();const y=window.scrollY;render();window.scrollTo({top:y,behavior:'instant'});
  }
  function route(){
    const match=location.hash.match(/^#stage-([1-6])$/);
    if(match){state.lastStage=Number(match[1]);queueSave();}
  }
  function onEdit(event){
    const el=event.target.closest('[data-key]');if(!el)return;
    const key=el.dataset.key;
    if(el.type==='checkbox'){if(el.checked)state.answers[key]=true;else delete state.answers[key];}
    else if(String(el.value??'').trim())state.answers[key]=el.value;else delete state.answers[key];
    if(el.tagName==='TEXTAREA')autoGrow(el);
    queueSave();
  }
  function makeExport(){
    const c=currentCopy();
    const today=new Date().toLocaleDateString(state.language==='sl'?'sl-SI':'en-GB',{year:'numeric',month:'long',day:'numeric'});
    let out=`${c.exportTitle}\n${c.exportSubtitle}\n${c.exportDate}: ${today}\n\n`;
    c.stages.forEach((stage,index)=>{
      out+=`${String(index+1).padStart(2,'0')}  ${stage.title.toLocaleUpperCase(state.language==='sl'?'sl-SI':'en-GB')}\n${'—'.repeat(Math.max(8,stage.title.length))}\n\n`;
      stage.prompts.forEach(prompt=>{out+=`${prompt.text}\n${answerValue(prompt.key).trim()||c.empty}\n\n`;});
      if(stage.aside)out+=`${stage.aside.label}\n${stage.aside.text}\n\n`;
      if(stage.note)out+=`${stage.note.label}\n${stage.note.title?stage.note.title+' ':''}${stage.note.text}\n\n`;
      if(stage.after)out+=`${stage.after.label}\n${stage.after.text}\n\n`;
      if(stage.integrationPrep)out+=`${stage.integrationPrep.label}\n${stage.integrationPrep.text}\n\n`;
      if(index===5){out+=`${c.carry.title.toLocaleUpperCase(state.language==='sl'?'sl-SI':'en-GB')}\n`;c.carry.fields.forEach(field=>{out+=`${field.label}\n${answerValue(field.key).trim()||c.empty}\n\n`;});}
    });
    const earlier=RETIRED_PROMPTS[state.language].filter(([key])=>answerValue(key).trim());
    if(earlier.length){out+=`\n${state.language==='sl'?'DODATNI ZAPISI IZ PREJŠNJE RAZLIČICE':'ADDITIONAL NOTES FROM AN EARLIER VERSION'}\n\n`;earlier.forEach(([key,question])=>{out+=`${question}\n${answerValue(key).trim()}\n\n`;});}
    out+=`\n${c.finalEmphasis} ${c.finalText}\n\n${c.careText}\n`;
    return out;
  }
  function download(){collectAnswers();const blob=new Blob([makeExport()],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=state.language==='sl'?'pred-potjo-zapisi.txt':'before-the-journey-reflections.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);saveNow();}
  function clearAll(){state.answers={};state.lastStage=1;try{localStorage.removeItem(STORAGE_KEY);state.storageOK=true;}catch(_){state.storageOK=false;}render();history.replaceState(null,'',location.pathname+location.search+'#welcome');window.scrollTo(0,0);}

  render();
  document.addEventListener('input',onEdit);document.addEventListener('change',onEdit);
  document.addEventListener('click',event=>{
    const lang=event.target.closest('[data-lang-toggle]');if(lang){setLanguage(state.language==='sl'?'en':'sl');return;}
    const action=event.target.closest('[data-action]')?.dataset.action;
    if(action==='download')download();
    if(action==='print'){collectAnswers();saveNow();window.print();}
    if(action==='clear')$('#clear-dialog').showModal();
  });
  $('#confirm-clear').addEventListener('click',()=>{$('#clear-dialog').close();clearAll();});
  $('#cancel-clear').addEventListener('click',()=>$('#clear-dialog').close());
  $('#clear-dialog').addEventListener('click',event=>{if(event.target===$('#clear-dialog'))$('#clear-dialog').close();});
  window.addEventListener('hashchange',route);
  window.addEventListener('pagehide',()=>{collectAnswers();saveNow();});
  route();
})();
</script>
