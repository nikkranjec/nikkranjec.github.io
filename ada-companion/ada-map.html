<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ada Bojana map</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<style>
html, body { margin: 0; height: 100%; background: #3A1210; font-family: Poppins, system-ui, sans-serif; }
#map { position: absolute; inset: 0; }
.leaflet-tile { filter: saturate(.85) brightness(.92) sepia(.18); }
.leaflet-container { background: #2D0C0A; }
.leaflet-top { top: 46px; }
.leaflet-control-zoom a { background: rgba(32,10,8,.86) !important; color: #FEF5ED !important; border: none !important; }
.pin-wrap { cursor: pointer; }
.editing .pin-wrap { cursor: grab; }
.delbadge { display: none; }
.editing .delbadge { display: block; }
</style>
</head>
<body>
<div id="map"></div>
<div id="editbar" style="position:absolute;left:50%;top:54px;transform:translateX(-50%);z-index:1000;display:none;align-items:center;gap:8px;background:rgba(32,10,8,.92);border:1px solid rgba(242,193,107,.45);border-radius:18px;padding:7px 8px 7px 14px;white-space:nowrap">
  <span id="editmsg" style="font-weight:600;font-size:10px;color:#FFEDC2">drag anything to place it</span>
  <button id="copybtn" style="border:none;border-radius:12px;padding:5px 10px;background:linear-gradient(180deg,#FFEDC2,#F2C16B 55%,#C89033);font:700 10px Poppins;color:#8E1F1A;cursor:pointer">copy layout</button>
  <button id="resetbtn" style="border:1px solid rgba(254,245,237,.25);border-radius:12px;padding:4px 10px;background:transparent;font:700 10px Poppins;color:rgba(254,245,237,.75);cursor:pointer">reset</button>
</div>
<script>
// © 2026 ADA Companion — proprietary. Not licensed for reuse or AI-assisted duplication.
// Ada Bojana, Montenegro — pin defaults are laid over the real island; drag to correct.
var N = 41.8672, S = 41.8570, W = 19.3395, E = 19.3585;
var STORE = 'ada-pin-geo-v1';
var BAKED = {"o-27":[41.864016,19.345186],"o-28":null,"o-31":[41.863361,19.346795],"o-26":[41.864304,19.343255],"o-32":[41.864623,19.343898],"o-3":[41.865007,19.34216],"o-8":[41.864815,19.342504],"o-10":null,"o-20":[41.864863,19.34231],"s-garden":null,"s-grove":[41.864272,19.342514],"o-1":null,"o-2":null,"o-15":[41.865694,19.338684],"o-12":null,"o-21":null,"o-23":null,"o-24":null,"o-7":null,"o-5":null,"o-13":null,"s-chai":null,"s-hearth":[41.863153,19.342933],"s-shala":[41.865734,19.341527],"s-temple":[41.865454,19.339349],"o-9":null,"o-11":null,"o-22":null,"o-19":null,"s-point":null,"s-dome":[41.864615,19.340776],"o-17":null,"o-0":null,"o-25":null,"o-14":null,"o-16":null,"o-6":null,"o-30":null,"o-29":null,"s-deck":null,"s-sea":null,"o-18":null,"o-4":null};
var map = L.map('map', { zoomControl: false, attributionControl: false }).setView([41.8645, 19.3422], 16);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: 'Esri, Maxar, Earthstar Geographics', maxZoom: 19 }).addTo(map);


var saved = {};
try { saved = Object.assign({}, BAKED, JSON.parse(localStorage.getItem(STORE) || '{}')); } catch (e) { saved = Object.assign({}, BAKED); }
var markers = {}, editing = false;

function toLatLng(p) {
  if (saved[p.key]) return saved[p.key];
  return [N - p.y / 100 * (N - S), W + p.x / 100 * (E - W)];
}
function isDeleted(p) { return saved[p.key] === null; }
function persist() { try { localStorage.setItem(STORE, JSON.stringify(saved)); } catch (e) {} }
function stageHtml(p) {
  var lv = liveMap[p.key.slice(2)];
  return '<div class="pin-wrap" style="transform:translate(-15px,-15px);display:inline-flex;align-items:center;gap:6px;padding:5px 9px 5px 5px;border-radius:20px;background:rgba(32,10,8,.86);border:1px solid rgba(242,193,107,.5);white-space:nowrap">' +
    '<span style="width:19px;height:19px;border-radius:50%;background:#F2C16B;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:10px;color:#8E1F1A;flex:none">' + p.no + '</span>' +
    '<span style="display:flex;flex-direction:column;align-items:flex-start">' +
    '<span style="font-weight:700;font-size:11px;color:#FEF5ED">' + p.name + '</span>' +
    (lv ? '<span style="font-weight:600;font-size:8.5px;color:' + (lv.indexOf('live') === 0 ? '#FFEDC2' : 'rgba(254,245,237,.75)') + ';margin-top:1px;max-width:150px;overflow:hidden;text-overflow:ellipsis">' + lv + '</span>' : '') +
    '</span>' + frHtml(p) + delBadge('7px') + '</div>';
}
function delBadge(top) {
  return '<span class="delbadge" style="position:absolute;top:' + (top || '-5px') + ';right:-5px;width:15px;height:15px;border-radius:50%;background:#B23A31;border:1.5px solid #FEF5ED;color:#FEF5ED;font-size:9px;line-height:12px;text-align:center;font-weight:700">\u00d7</span>';
}
function dotHtml(p) {
  return '<div class="pin-wrap" style="transform:translate(-50%,-50%);display:inline-flex;flex-direction:column;align-items:center;gap:2px;position:relative">' +
    '<span style="width:10px;height:10px;border-radius:50%;background:' + p.color + ';box-shadow:0 0 0 1.5px rgba(28,8,6,.75)"></span>' +
    '<span style="font-weight:600;font-size:8.5px;color:#FEF5ED;text-shadow:0 1px 3px rgba(28,8,6,.95),0 0 6px rgba(28,8,6,.7);white-space:nowrap">' + p.name + '</span>' + delBadge('-9px') + '</div>';
}
function build(pins) {
  Object.values(markers).forEach(function (m) { map.removeLayer(m); });
  markers = {};
  pins.forEach(function (p) {
    if (isDeleted(p)) return;
    var icon = L.divIcon({ html: p.isStage ? stageHtml(p) : dotHtml(p), className: '', iconSize: [0, 0] });
    var m = L.marker(toLatLng(p), { icon: icon, draggable: editing, zIndexOffset: p.isStage ? 300 : 0 }).addTo(map);
    m.on('click', function () {
      if (!editing) { parent.postMessage({ type: 'ada:tap', key: p.key }, '*'); return; }
      if (m.__dragging) return;
      saved[p.key] = null; persist();
      map.removeLayer(m); delete markers[p.key];
      document.getElementById('editmsg').textContent = p.name + ' removed \u00b7 reset brings it back';
    });
    m.on('dragstart', function () { m.__dragging = true; });
    m.on('dragend', function () {
      setTimeout(function () { m.__dragging = false; }, 120);
      var ll = m.getLatLng();
      saved[p.key] = [+ll.lat.toFixed(6), +ll.lng.toFixed(6)];
      persist();
    });
    markers[p.key] = m;
  });
}
var pinData = [];
var liveMap = {};
var friendsMap = {};
function frHtml(p) {
  var fr = friendsMap[p.key.slice(2)] || [];
  if (!fr.length) return '';
  return '<span style="display:flex;margin-left:2px">' + fr.map(function (f, i) {
    return '<span style="width:15px;height:15px;border-radius:50%;background:' + f.c + ';border:1.5px solid rgba(32,10,8,.9);margin-left:' + (i ? '-5px' : '0') + ';display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:7.5px;color:#8E1F1A">' + f.i + '</span>';
  }).join('') + '</span>';
}
function refreshLive() {
  pinData.forEach(function (p) {
    if (p.isStage && markers[p.key]) markers[p.key].setIcon(L.divIcon({ html: stageHtml(p), className: '', iconSize: [0, 0] }));
  });
}
window.addEventListener('message', function (ev) {
  var d = ev.data || {};
  if (d.type === 'ada:pins') { pinData = d.pins; build(pinData); }
  if (d.type === 'ada:live') { liveMap = d.live || {}; friendsMap = d.friends || {}; refreshLive(); }
  if (d.type === 'ada:edit') { setEdit(d.on); }
  if (d.type === 'ada:locate') { toggleLoc(); }
});
function setEdit(on) {
  editing = on;
  document.body.classList.toggle('editing', on);
  var bar = document.getElementById('editbar');
  bar.style.display = on ? 'flex' : 'none';
  document.getElementById('editmsg').textContent = 'drag to place \u00b7 tap \u00d7 to remove';
  Object.values(markers).forEach(function (m) { on ? m.dragging.enable() : m.dragging.disable(); });
}
document.getElementById('copybtn').onclick = function () {
  var out = {};
  pinData.forEach(function (p) {
    if (isDeleted(p)) { out[p.key] = null; return; }
    var ll = markers[p.key].getLatLng(); out[p.key] = [+ll.lat.toFixed(6), +ll.lng.toFixed(6)];
  });
  var txt = JSON.stringify(out);
  var done = function () { document.getElementById('editmsg').textContent = 'copied — paste it to me in chat'; };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, function () { prompt('Copy the layout:', txt); });
  else prompt('Copy the layout:', txt);
};
document.getElementById('resetbtn').onclick = function () {
  saved = Object.assign({}, BAKED);
  try { localStorage.removeItem(STORE); } catch (e) {}
  build(pinData);
  setEdit(editing);
  document.getElementById('editmsg').textContent = 'back to the default layout';
};
parent.postMessage({ type: 'ada:ready' }, '*');

// --- my location ---
var meMarker = null, meRing = null, watching = null;
function locState(on) { parent.postMessage({ type: 'ada:loc', on: on }, '*'); }
function showMe(lat, lng, acc) {
  var ll = [lat, lng];
  if (!meMarker) {
    meRing = L.circle(ll, { radius: acc || 20, color: '#FFEDC2', weight: 1, opacity: .5, fillColor: '#FFEDC2', fillOpacity: .12 }).addTo(map);
    meMarker = L.marker(ll, { icon: L.divIcon({ html: '<div style="width:15px;height:15px;border-radius:50%;background:#FFEDC2;border:2.5px solid rgba(32,10,8,.9);box-shadow:0 0 0 4px rgba(255,237,194,.3)"></div>', className: '', iconSize: [15, 15], iconAnchor: [7.5, 7.5] }), zIndexOffset: 600, interactive: false }).addTo(map);
  } else { meMarker.setLatLng(ll); meRing.setLatLng(ll); meRing.setRadius(acc || 20); }
}
function toggleLoc() {
  if (watching != null) {
    navigator.geolocation.clearWatch(watching); watching = null;
    if (meMarker) { map.removeLayer(meMarker); map.removeLayer(meRing); meMarker = meRing = null; }
    locState(false);
    return;
  }
  if (!navigator.geolocation) { locState(false); return; }
  locState(true);
  var first = true;
  watching = navigator.geolocation.watchPosition(function (pos) {
    showMe(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy);
    if (first) { first = false; map.setView([pos.coords.latitude, pos.coords.longitude], Math.max(map.getZoom(), 17)); }
  }, function () {
    watching = null;
    locState(false);
  }, { enableHighAccuracy: true, maximumAge: 5000 });
}
</script>
</body>
</html>
